relation_justifications:
  - {<<: *relation_defaults, relation_id: bounded_predictive_performance__prediction, claim: bounded_predictive_performance, evidence_block: prediction, necessity_rationale: A predictive claim requires a held-out target-specific result rather than execution or association evidence.}
  - {<<: *relation_defaults, relation_id: bounded_predictive_performance__context_of_use, claim: bounded_predictive_performance, evidence_block: context_of_use, necessity_rationale: Predictive performance is authorized only for the evaluated population output and decision consequence.}
  - {<<: *relation_defaults, relation_id: bounded_predictive_performance__data_quality, claim: bounded_predictive_performance, evidence_block: data_quality, necessity_rationale: Prediction cannot be authorized when the fitness lineage exclusions or missingness of the evaluated data are unassessed.}
  - {<<: *relation_defaults, relation_id: clean_computational_reproduction__reproducible_compute, claim: clean_computational_reproduction, evidence_block: reproducible_compute, necessity_rationale: Clean computational reproduction is defined by re-executable code environment entry point and bound artifacts.}
  - {<<: *relation_defaults, relation_id: within_resource_reproduction__internal_reproduction, claim: within_resource_reproduction, evidence_block: internal_reproduction, necessity_rationale: Within-resource reproduction requires a stable endpoint on explicit non-overlapping units from that resource.}
  - {<<: *relation_defaults, relation_id: within_resource_reproduction__data_quality, claim: within_resource_reproduction, evidence_block: data_quality, necessity_rationale: Apparent agreement between partitions is uninterpretable when their source quality exclusions or missingness differ without audit.}
  - {<<: *relation_defaults, relation_id: independent_study_replication__external_replication, claim: independent_study_replication, evidence_block: external_replication, necessity_rationale: Independent replication requires a genuinely new data-generation process and cannot be supplied by another partition of the same observations.}
  - {<<: *relation_defaults, relation_id: independent_study_replication__context_of_use, claim: independent_study_replication, evidence_block: context_of_use, necessity_rationale: Replication requires the same bounded endpoint and use context rather than merely another positive result.}
  - {<<: *relation_defaults, relation_id: independent_study_replication__data_quality, claim: independent_study_replication, evidence_block: data_quality, necessity_rationale: Replication status depends on auditable fitness and lineage in both the original and independent resources.}
  - {<<: *relation_defaults, relation_id: topology_specific_prediction__prediction, claim: topology_specific_prediction, evidence_block: prediction, necessity_rationale: Topology specificity must first preserve empirical predictive adequacy for the declared target.}
  - {<<: *relation_defaults, relation_id: topology_specific_prediction__topology_specificity, claim: topology_specific_prediction, evidence_block: topology_specificity, necessity_rationale: The topology component requires a prespecified complexity-matched control family that isolates topology from model capacity.}
  - {<<: *relation_defaults, relation_id: topology_specific_prediction__uncertainty_quantification, claim: topology_specific_prediction, evidence_block: uncertainty_quantification, necessity_rationale: A topology margin without uncertainty at the inferential unit cannot authorize specificity.}
  - {<<: *relation_defaults, relation_id: topology_specific_prediction__robustness, claim: topology_specific_prediction, evidence_block: robustness, necessity_rationale: Specificity must persist across the declared control and analysis perturbations rather than one favorable comparison.}
  - {<<: *relation_defaults, relation_id: topology_specific_prediction__context_of_use, claim: topology_specific_prediction, evidence_block: context_of_use, necessity_rationale: Topology specificity is bounded to the tested scale population output and control family.}
  - {<<: *relation_defaults, relation_id: assumption_conditional_direction__directed_identifiability, claim: assumption_conditional_direction, evidence_block: directed_identifiability, necessity_rationale: Direction can be authorized only inside an explicit model class assumption domain and abstention rule.}
  - {<<: *relation_defaults, relation_id: assumption_conditional_direction__uncertainty_quantification, claim: assumption_conditional_direction, evidence_block: uncertainty_quantification, necessity_rationale: Directional selection requires uncertainty for the declared directional estimand and inferential unit.}
