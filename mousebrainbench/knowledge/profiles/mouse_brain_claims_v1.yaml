profile_id: mouse_brain_claims
version: 1.1.0
domain: computational_mouse_brain
description: >-
  Evidence requirements and non-compensatory inference rules for claims made
  from computational mouse-brain models and multimodal neuroscience artifacts.

claims:
  - id: predictive
    required_blocks: [prediction]
    meaning: held-out prediction passes a protocol declared for the evaluated domain
  - id: computationally_reproducible
    required_blocks: [reproducible_compute]
    meaning: the declared software and artifact workflow can be reproduced from a clean revision
  - id: internally_reproduced
    required_blocks: [internal_reproduction]
    meaning: the result is reproduced in non-overlapping units or cohorts within the same resource
  - id: externally_replicated
    required_blocks: [external_replication]
    meaning: the result is replicated in an independent resource, laboratory, or study
  - id: topology_specific
    required_blocks: [topology_specificity]
    meaning: the tested topology outperforms prespecified topology controls
  - id: directed
    required_blocks: [directed_identifiability]
    meaning: direction is identified by a declared directional test
  - id: structure_function
    required_blocks: [structure_function_association]
    meaning: a local association survives its declared matched controls and multiplicity rule
  - id: mechanistic
    required_blocks:
      - prediction
      - internal_reproduction
      - topology_specificity
      - directed_identifiability
    meaning: prediction, internal reproduction, topology specificity, and direction all pass
  - id: causal
    required_blocks: [causal_intervention]
    meaning: an intervention or another prespecified causal-identification design passes
  - id: digital_twin
    required_blocks:
      - prediction
      - internal_reproduction
      - topology_specificity
      - directed_identifiability
      - causal_intervention
      - whole_brain_coverage
      - independent_validation
      - reproducible_compute
      - entity_specificity
      - operational_compute
    meaning: all predictive, mechanistic, causal, coverage, entity-specific, independent-validation, reproducibility, and operational-compute blocks pass

inference_rules:
  - id: failed_block_veto
    priority: 100
    quantifier: any
    evidence_status: failed
    conclusion: blocked
    rationale: at least one required evidence block failed
  - id: external_review_escalation
    priority: 90
    quantifier: any
    evidence_status: requires_review
    conclusion: needs_external_review
    rationale: at least one required block cannot be decided automatically
  - id: missing_evidence_uncertainty
    priority: 80
    quantifier: any
    evidence_status: unknown
    conclusion: uncertain
    rationale: at least one required evidence block was not observed
  - id: protocol_scope_boundary
    priority: 70
    quantifier: any
    evidence_status: not_applicable
    conclusion: out_of_scope
    rationale: the evaluated protocol did not target at least one required block
  - id: all_requirements_satisfied
    priority: 0
    quantifier: all
    evidence_status: passed
    conclusion: supported
    rationale: all required evidence blocks passed their declared domain-specific rules
