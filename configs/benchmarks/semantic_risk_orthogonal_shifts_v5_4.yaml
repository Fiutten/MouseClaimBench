    reference: dimension_6
    interpretation: categorical_topology_size_transport_not_a_monotone_dose
  temporal_depth:
    levels: [lag_2, lag_3, lag_4]
    reference: lag_2
    interpretation: increasing_maximum_structural_lag
  latent_confounding:
    levels: [confound_absent, confound_present]
    reference: confound_absent
    interpretation: binary_official_generator_contrast_not_a_confounding_dose_curve

simultaneous_contract:
  total_levels: 13
  familywise_confidence: 0.95
  per_level_confidence: 0.9961538461538462
  multiplicity_method: Bonferroni_across_thirteen_evaluable_family_levels
  target_seed_bundle_failure_probability: 0.10
  minimum_authorized_seed_bundle_coverage: 0.10
  minimum_positive_recovery: 0.05
  minimum_independent_units: 29

shift_diagnostic:
  familywise_alpha: 0.05
  per_level_alpha: 0.0038461538461538464
  permutations: 999
  role: warning_only
  may_refit_threshold: false
  may_restore_certificate: false

primary_endpoints:
  - false_authorization_seed_bundles_by_level
  - missed_positive_seed_bundles_by_level
  - first_shift_warning_within_ordered_families
  - first_certificate_failure_within_ordered_families

claim_boundary: >-
  These families estimate failure behavior on exact official TimeGraph model
  contrasts. They do not calibrate a universal shift detector, establish
  monotonic degradation outside ordered families, or provide real-domain risk.
