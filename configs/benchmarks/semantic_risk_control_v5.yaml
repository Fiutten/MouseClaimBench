protocol_id: mouseclaimbench_hierarchical_semantic_risk_control
version: 5.0.0
status: frozen_before_v5_outcome_generation
freeze_date: 2026-08-02
parent_release: semantic-risk-control-v4@0ca7c916d9f8d1e5167bf8e7f07643fdb1be3919

scientific_question: >-
  Can a non-compensatory scientific-claim authorizer retain non-zero utility
  while controlling false authorization at a declared independent top-level
  unit, and can it expose loss of validity under a real-domain temporal shift?

pre_freeze_access_disclosure:
  timegraph:
    accessed: true
    permitted_access:
      - paper_and_repository_metadata
      - source_code_and_license_audit
      - one_raw_csv_format_preview
    outcome_statistics_computed: false
    interpretation: >-
      This is a prospective generation study, not a blind evaluation of the
      pre-generated TimeGraph suite. All v5 random seeds and endpoint rules were
      fixed before generating their outcomes.
  causalrivers:
    accessed: true
    permitted_access:
      - paper_and_repository_metadata
      - package_code_and_license_audit
      - release_asset_size_header
    outcome_statistics_computed: false

confirmatory_population:
  resource: TimeGraph
  citation_doi: 10.1145/3711896.3737439
  repository: https://github.com/hferdous/TimeGraph
  source_revision: 4d93403b002664fa55607f308ad0e80623472ded
  source_files:
    Codes/a1.py: sha256:1840a5c267c671cb74ad03aa7090608a02cb67cd44416e347f00f8431a744799
    Codes/a1c.py: sha256:795d6e86cf894e25b386c9dae4b4910288931d343da4d58c328e7b349c82e038
  source_transformations:
    - remove_colab_shell_magic_install_line
    - remove_unused_tigramite_plotting_import
    - remove_unused_matplotlib_plotting_import
    - execute_definitions_before_main_guard_only
  upstream_interoperability_note: >-
    The published Python exports contain additional Colab shell and download
    commands after the main guard. They are not importable as ordinary Python
    modules. The v5 adapter executes only the hash-verified definitions before
    that guard and does not alter numerical generator statements.
  numerical_generator_reimplementation_allowed: false
  generated_target_population: >-
    Equal-weight mixture of the official A1 and A1C generators, Gaussian and
    Student-t noise, and lags two and three, with six observed variables and
    1200 time points per scenario.
  factors:
    generator: [a1, a1c]
    noise: [gaussian, student_t]
    max_lag: [2, 3]
    n_vars: 6
    n_points: 1200
    noise_scale: 0.1
    student_t_df: 3
  split_seeds:
    target_calibration: {start: 2026085001, count: 50}
    risk_lock: {start: 2026085101, count: 50}
    final: {start: 2026085201, count: 50}
    ood_stress: {start: 2026085301, count: 50}
  independent_unit: seed_bundle
  hierarchy:
    - seed_bundle
    - generator_scenario
    - directed_pair
    - claim_candidate
  pair_sampling:
    direct_pairs_per_scenario: 1
    control_pairs_per_scenario: 1
    rule: sha256_namespace_order_without_replacement
  inferential_contract:
    target_seed_bundle_failure_probability: 0.10
    confidence_level: 0.95
    minimum_authorized_seed_bundle_coverage: 0.10
    minimum_positive_recovery: 0.05
    failure_event: at_least_one_false_authorization_within_seed_bundle
    final_access_requires_risk_lock: true
    pair_or_scenario_level_binomial_inference_prohibited: true
    certification_requires_all:
      - risk_upper_bound_at_or_below_target
      - coverage_lower_bound_at_or_above_minimum
      - positive_recovery_lower_bound_at_or_above_minimum
      - zero_semantic_gate_violations
      - risk_lock_passed_before_final_evaluation
      - minimum_29_independent_seed_bundles
  robustness:
    - leave_one_generator_family_out
    - worst_generator_family_empirical_failure
    - random_effect_heterogeneity_description
    - low_sample_high_noise_ood_stress_test
  ood_stress_factors:
    n_points: 400
    noise_scale: 0.25
    interpretation: diagnostic_only_not_part_of_the_confirmatory_certificate

real_transport_population:
  resource: CausalRivers
  citation_url: https://proceedings.iclr.cc/paper_files/paper/2025/hash/a205fda871b0f6c1e18a7ad7325eb6cf-Abstract-Conference.html
  repository: https://github.com/CausalRivers/causalrivers
  source_revision: a30154fbb9a2e03bae133c643d7e978df63b3766
  release_asset: https://github.com/CausalRivers/causalrivers/releases/download/First_release/product.zip
  expected_compressed_bytes: 133228548
  regions: [bavaria, east_germany, elbe_flood]
  pair_sampling:
    direct_pairs_per_region: 40
    matched_non_edges_per_region: 40
    namespace: mouseclaimbench-v5-causalrivers
  role: external_transport_and_shift_diagnostic_only
  allowed_endpoints:
    - descriptive_claim_authorization_metrics
    - region_clustered_counts
    - temporal_shift_warning
    - frozen_policy_comparison
  prohibited_interpretations:
    - independent_replication_by_subgraph
    - exact_external_risk_certificate
    - causal_validation_from_hydrological_adjacency_alone
    - generalization_to_mouse_brain_models

comparators:
  - abstain_all
  - fixed_probability_0_5
  - confidence_only_target_calibrated
  - evidence_contract_only
  - frozen_v3_semantic_ltt
  - v5_hierarchical_nondegenerate

decision_rule:
  externally_supported: >-
    The TimeGraph risk lock and final split both satisfy the complete
    seed-bundle contract. CausalRivers remains a descriptive transport result.
  method_only: >-
    Semantics and internal tests pass, but either risk lock, final risk,
    activation, recovery, or minimum-unit requirements fail.
  rejected: semantic_gate_violation_or_protocol_order_violation

profile_validation:
  status: pending_independent_domain_expert_review
  self_validation_may_satisfy_requirement: false
  required_before_consensus_profile_claim:
    - independent_raters
    - declared_expertise
    - blinded_item_order
    - content_validity_and_agreement_analysis

prohibited_claims:
  - universal_or_distribution_free_false_authorization_control
  - consensus_validated_knowledge_profile
  - causal_direction_from_prediction_or_adjacency
  - complete_mouse_brain_digital_twin
  - whole_brain_mechanistic_validity
  - human_expert_validation_performed_by_the_authors
