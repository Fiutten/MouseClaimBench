protocol_id: mouseclaimbench_profile_v2_contract_mutation
version: 1.0.0
status: frozen_before_outcome_execution
freeze_date: 2026-08-02
profile: mousebrainbench/knowledge/profiles/mouse_brain_claims_v2.yaml

scientific_question: >-
  Does the hardened profile authorizer reject every controlled contract defect,
  preserve all simultaneous deficits, and remain semantically equivalent to an
  independent ASP implementation while transparent shortcuts fail?

scope:
  estimand: executable_contract_conformance
  scientific_truth_claimed: false
  content_validity_claimed: false
  human_validation_claimed: false
  biological_validity_claimed: false

case_families:
  - pristine_complete
  - single_status_defect
  - omitted_required_block
  - missing_required_observation
  - pairwise_mixed_status_defects

status_defects: [failed, unknown, not_applicable, requires_review]
pairwise_status_design: full_cartesian_product
metadata_design: remove_each_required_observation_once
asp_conformance:
  selection: all_generated_cases

comparators:
  - raw_status_all_passed_ignoring_schema
  - equal_weight_75_percent_ignoring_schema
  - prediction_shortcut_ignoring_schema
  - prioritized_single_reason_trace

primary_endpoints:
  - zero_false_authorizations_by_profile_v2
  - all_pristine_cases_authorized
  - exact_deficit_set_recall_equal_1
  - python_asp_status_and_deficit_equivalence_equal_1
  - at_least_one_transparent_comparator_has_false_authorizations

interpretation: >-
  Success establishes internal semantic safety against the enumerated contract
  mutations. It does not validate whether the author-defined requirements are a
  complete or consensus scientific taxonomy.
